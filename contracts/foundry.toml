[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/"]

[fuzz]
runs = 512

[profile.deep.fuzz]
runs = 20000

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
